appId: com.mitatime.app
productName: MitaTime
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - package.json

asar: true
compression: maximum

win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch: [x64]
  icon: resources/icon.png

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.png

linux:
  target:
    - target: AppImage
  category: Utility
  icon: resources/icon.png
